name: CI

# Быстрые проверки на каждый пуш в main и на pull request — чтобы ловить регрессии
# до создания тега-релиза (см. release.yml). Тег собирает и публикует релиз,
# а этот workflow отвечает только за качество кода.
on:
  push:
    branches: [main]
  pull_request:

# Отменяем предыдущий прогон той же ветки/PR при новом пуше.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # cgo-часть Wails (пакет application) требует GTK4 + WebKitGTK.
      - name: Системные зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            libsoup-3.0-dev \
            build-essential \
            pkg-config

      - name: Проверка форматирования (gofmt)
        run: |
          unformatted="$(gofmt -l main.go internal)"
          if [ -n "$unformatted" ]; then
            echo "Эти файлы не отформатированы (gofmt -l main.go internal):"
            echo "$unformatted"
            exit 1
          fi

      # main.go встраивает //go:embed all:frontend/dist (в git не хранится).
      # Для проверки компиляции достаточно заглушки; реальную сборку dist проверяет job frontend.
      - name: Заглушка frontend/dist (для go:embed)
        run: |
          mkdir -p frontend/dist
          touch frontend/dist/index.html

      - name: Lint (golangci-lint)
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          golangci-lint run

      - name: Build
        run: go build . ./internal/...

      - name: Vet
        run: go vet . ./internal/...

      - name: Test
        run: go test ./internal/...

  frontend:
    name: Frontend (React/TS)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Установка зависимостей
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Lint (biome)
        working-directory: frontend
        run: npm run lint

      - name: Test (vitest)
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build
