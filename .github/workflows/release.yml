name: Release

# Собирается на «родных» раннерах для каждой ОС: пуш тега вида vX.Y.Z собирает
# пакеты, складывает их в артефакты и публикует GitHub Release. `workflow_dispatch`
# позволяет прогнать сборку вручную без публикации (артефакты останутся в Actions).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# Один релиз на тег; повторный пуш тега не плодит параллельные публикации.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  WAILS_VERSION: v3.0.0-beta.27

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            artifacts: |
              bin/*.deb
              bin/*.rpm
              bin/*.AppImage
              bin/*.pkg.tar.zst
          - os: windows-latest
            platform: windows
            artifacts: |
              bin/*.exe
              bin/*-windows-amd64.zip
          - os: macos-latest
            platform: darwin
            artifacts: |
              bin/*.dmg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Linux: стек GTK4 + WebKitGTK 6.0 (cgo обязателен). Ставим ДО установки wails3,
      # потому что сам CLI собирается с cgo и требует эти .pc-файлы.
      - name: Системные зависимости (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            libsoup-3.0-dev \
            build-essential \
            pkg-config \
            squashfs-tools

      # Windows: NSIS для установщика; choco-шим иногда не попадает в PATH текущей сессии.
      - name: Установка NSIS (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files (x86)\NSIS"

      - name: Установка Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Сборка пакетов (Linux)
        if: matrix.platform == 'linux'
        env:
          # linuxdeploy (AppImage) запускается без FUSE на раннерах.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          wails3 package
          ls -la bin

      - name: Сборка установщика (Windows, NSIS)
        if: matrix.platform == 'windows'
        run: wails3 task windows:package

      # Портативный вариант (запуск без установки): голый .exe публикуется как есть
      # (bin/*.exe), плюс .zip с тем же .exe для удобной раздачи.
      - name: Портативный .zip (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: Compress-Archive -Path bin/proxy-pool-manager.exe -DestinationPath bin/proxy-pool-manager-windows-amd64.zip -Force

      - name: Подпись установщика (если задан сертификат)
        if: matrix.platform == 'windows' && secrets.WIN_CERT_PFX_BASE64 != ''
        shell: pwsh
        env:
          WIN_CERT_PFX_BASE64: ${{ secrets.WIN_CERT_PFX_BASE64 }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:WIN_CERT_PFX_BASE64))
          $installer = Get-ChildItem bin\*-installer.exe | Select-Object -First 1
          wails3 tool sign --input $installer.FullName `
            --certificate "$env:RUNNER_TEMP\cert.pfx" `
            --password "$env:WIN_CERT_PASSWORD" `
            --timestamp "http://timestamp.digicert.com"
          Remove-Item "$env:RUNNER_TEMP\cert.pfx"

      # macOS: универсальный бинарник (Intel + Apple Silicon) и .dmg. Сборка и подпись —
      # только на macOS: нотаризация Apple требует ключей и утилит, которых нет на Linux.
      - name: Импорт сертификата (macOS, если задан)
        if: matrix.platform == 'darwin' && secrets.MACOS_CERT_P12_BASE64 != ''
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions build.keychain
          rm "$RUNNER_TEMP/cert.p12"

      - name: "Сборка .app (universal: arm64 + amd64)"
        if: matrix.platform == 'darwin'
        run: wails3 task darwin:package:universal

      - name: Подпись .app (macOS, если задан сертификат)
        if: matrix.platform == 'darwin' && secrets.MACOS_CERT_P12_BASE64 != ''
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: wails3 tool sign --input "bin/proxy-pool-manager.app" --identity "$MACOS_SIGN_IDENTITY" --hardened-runtime

      - name: Сборка .dmg (macOS)
        if: matrix.platform == 'darwin'
        run: wails3 task darwin:create:dmg

      - name: Профиль нотаризации (macOS, если заданы ключи Apple)
        if: matrix.platform == 'darwin' && secrets.APPLE_ID != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool store-credentials "wails-notary" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"

      - name: Нотаризация .dmg (macOS, если заданы ключи Apple)
        if: matrix.platform == 'darwin' && secrets.APPLE_ID != ''
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          DMG=$(ls bin/*.dmg | head -n1)
          wails3 tool sign --input "$DMG" --identity "$MACOS_SIGN_IDENTITY" --notarize --keychain-profile "wails-notary"
          xcrun stapler staple "$DMG" || true

      - name: Загрузка артефактов
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-artifacts
          if-no-files-found: error
          path: ${{ matrix.artifacts }}

  release:
    name: Публикация релиза
    needs: build
    # Публикуем только по тегу; при ручном запуске (workflow_dispatch) остаются артефакты Actions.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Скачивание артефактов
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Создание GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
